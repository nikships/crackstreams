name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
      - name: Show toolchain
        run: swift --version
      - name: Run unit tests
        run: swift test
      - name: Build app bundle
        run: bash Scripts/build-app.sh
      - name: Validate Samsung TV sources
        run: |
          node --check tv/app/app.js
          node --check tv/tests/preview.mjs
          node --test tv/tests/*.test.cjs
          xmllint --noout tv/app/config.xml
          bash Scripts/build-tv.sh
      - name: Validate scripts
        run: for script in build.sh Scripts/*.sh; do bash -n "$script" || exit; done
