name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
      - name: Show toolchain
        run: swift --version
      - name: Run macOS unit tests
        run: swift test
      - name: Build macOS app bundle
        run: bash Scripts/build-app.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: windows/go.sum
      - name: Run Windows Go tests
        working-directory: windows
        run: go test -race ./...
      - name: Cross-compile Windows packages
        run: bash Scripts/build-windows.sh
      - name: Validate Samsung TV client
        run: |
          node --check tv/app/app.js
          node --check tv/app/service.js
          node --check tv/tests/preview.mjs
          node --test tv/tests/*.test.cjs
          xmllint --noout tv/app/config.xml
          bash Scripts/build-tv.sh
      - name: Validate scripts
        run: for script in build.sh Scripts/*.sh; do bash -n "$script" || exit; done
